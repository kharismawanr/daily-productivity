services:
  backend:
    build:
      context: ./backend
    container_name: daily-productivity-backend
    restart: always
    ports:
      - "3002:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME:-daily_productivity}
      - API_KEY=${API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_KEY: ${API_KEY}
    container_name: daily-productivity-frontend
    restart: always
    ports:
      - "8182:80"
    depends_on:
      - backend